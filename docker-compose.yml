services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockpilot
      POSTGRES_USER: stockpilot
      POSTGRES_PASSWORD: stockpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpilot -d stockpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: stockpilot
      RABBITMQ_DEFAULT_PASS: stockpilot
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: stockpilot
      MINIO_ROOT_PASSWORD: stockpilot123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  adminer:
    image: adminer:4
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/stockpilot
      DATABASE_USERNAME: stockpilot
      DATABASE_PASSWORD: stockpilot
      REDIS_HOST: redis
      CACHE_TYPE: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: stockpilot
      RABBITMQ_PASSWORD: stockpilot
      MANAGEMENT_HEALTH_REDIS_ENABLED: "true"
      MANAGEMENT_HEALTH_RABBIT_ENABLED: "true"
      LOCAL_STORAGE_ROOT: /app/uploads
      JWT_SECRET: change-me-to-a-very-long-random-secret-before-production
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      APP_CLERK_ENABLED: ${APP_CLERK_ENABLED:-false}
      APP_CLERK_LEGACY_MIGRATION_ENABLED: ${APP_CLERK_LEGACY_MIGRATION_ENABLED:-false}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_JWT_PUBLIC_KEY: ${CLERK_JWT_PUBLIC_KEY:-}
      APP_PLATFORM_ADMIN_EMAILS: ${APP_PLATFORM_ADMIN_EMAILS:-}
      APP_AI_ENABLED: ${APP_AI_ENABLED:-false}
      APP_AI_PROVIDER: ${APP_AI_PROVIDER:-gemini}
      APP_AI_MODEL: ${APP_AI_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      APP_AI_TIMEOUT_SECONDS: ${APP_AI_TIMEOUT_SECONDS:-20}
      APP_AI_USER_REQUESTS_PER_MINUTE: ${APP_AI_USER_REQUESTS_PER_MINUTE:-10}
      APP_AI_TENANT_REQUESTS_PER_MINUTE: ${APP_AI_TENANT_REQUESTS_PER_MINUTE:-60}
      APP_IMPORT_JOBS_ENABLED: ${APP_IMPORT_JOBS_ENABLED:-true}
      APP_IMPORT_JOBS_POLL_MS: ${APP_IMPORT_JOBS_POLL_MS:-1500}
      APP_DEMO_SEED_ENABLED: "false"
      SWAGGER_PUBLIC_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
  backend-uploads:
