spring:
  application:
    name: stockpilot-ai
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/stockpilot}
    username: ${DATABASE_USERNAME:stockpilot}
    password: ${DATABASE_PASSWORD:stockpilot}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:5}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:0}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DATABASE_VALIDATION_TIMEOUT_MS:5000}
  flyway:
    enabled: true
    url: ${FLYWAY_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/stockpilot}}
    user: ${FLYWAY_USERNAME:${DATABASE_USERNAME:stockpilot}}
    password: ${FLYWAY_PASSWORD:${DATABASE_PASSWORD:stockpilot}}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  cache:
    type: ${CACHE_TYPE:simple}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:stockpilot}
    password: ${RABBITMQ_PASSWORD:stockpilot}
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:500MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:525MB}

server:
  port: ${SERVER_PORT:${PORT:8080}}
  error:
    include-stacktrace: never

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.stockpilot.ai: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:WARN}

sentry:
  enabled: ${SENTRY_ENABLED:false}
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}
  send-default-pii: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          # Process availability must not depend on a sleeping database or identity provider.
          include: livenessState
          show-details: never
          show-components: never
  health:
    # Redis and RabbitMQ are optional when running the API directly in local development.
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}
    rabbit:
      enabled: ${MANAGEMENT_HEALTH_RABBIT_ENABLED:false}

app:
  import:
    max-upload-size: ${IMPORT_MAX_UPLOAD_SIZE:${UPLOAD_MAX_FILE_SIZE:500MB}}
  jwt:
    secret: ${JWT_SECRET:local-dev-only-change-this-secret-local-dev-only-change-this-secret}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:120}
  auth:
    # Local/default development allows immediate login after registration.
    # application-prod.yml always overrides this to true.
    require-email-verification: ${APP_AUTH_REQUIRE_EMAIL_VERIFICATION:false}
    verification-token-hours: ${APP_AUTH_VERIFICATION_TOKEN_HOURS:24}
    password-reset-token-minutes: ${APP_AUTH_PASSWORD_RESET_TOKEN_MINUTES:30}
    email-cooldown-seconds: ${APP_AUTH_EMAIL_COOLDOWN_SECONDS:60}
    google-client-id: ${GOOGLE_CLIENT_ID:}
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  email:
    provider: ${EMAIL_PROVIDER:local}
    from: ${EMAIL_FROM:StockPilot AI <noreply@example.com>}
    resend-api-key: ${RESEND_API_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  storage:
    local-root: ${LOCAL_STORAGE_ROOT:uploads}
  ai:
    enabled: ${APP_AI_ENABLED:false}
    provider: ${APP_AI_PROVIDER:gemini}
    model: ${APP_AI_MODEL:}
    gemini-api-key: ${GEMINI_API_KEY:}
    timeout-seconds: ${APP_AI_TIMEOUT_SECONDS:20}
    user-requests-per-minute: ${APP_AI_USER_REQUESTS_PER_MINUTE:10}
    tenant-requests-per-minute: ${APP_AI_TENANT_REQUESTS_PER_MINUTE:60}
  import-jobs:
    enabled: ${APP_IMPORT_JOBS_ENABLED:true}
    poll-ms: ${APP_IMPORT_JOBS_POLL_MS:1500}
  demo:
    seed-enabled: ${APP_DEMO_SEED_ENABLED:false}
  swagger:
    public-enabled: ${SWAGGER_PUBLIC_ENABLED:false}
  dev-tools:
    enabled: ${APP_DEV_TOOLS_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
