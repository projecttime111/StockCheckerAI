services:
  - type: web
    name: stockpilot-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: FLYWAY_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CACHE_TYPE
        value: simple
      - key: MANAGEMENT_HEALTH_REDIS_ENABLED
        value: "false"
      - key: MANAGEMENT_HEALTH_RABBIT_ENABLED
        value: "false"
      - key: APP_AUTH_REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: APP_DEMO_SEED_ENABLED
        value: "false"
      - key: APP_DEV_TOOLS_ENABLED
        value: "false"
      - key: SWAGGER_PUBLIC_ENABLED
        value: "false"
      - key: LOCAL_STORAGE_ROOT
        value: /app/uploads
      - key: SENTRY_ENABLED
        value: "false"
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.0"
      - key: LOG_LEVEL_ROOT
        value: INFO
      - key: LOG_LEVEL_APP
        value: INFO
